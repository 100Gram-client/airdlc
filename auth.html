<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Air DLC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </head>
<body>
<div class="background-effects"><div class="grid-bg"></div></div>
    <div class="auth-page">
        <div class="modal" id="authModal">
            <div class="auth-logo">
                <img src="logo.png" alt="Air DLC">
                <h2>Air DLC</h2>
                <p>Sign in to your account</p>
            </div>
            <div class="auth-from-loader" id="loaderHint" style="display:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Authenticating via Air DLC Loader
            </div>
            <form class="auth-form" id="authForm" onsubmit="return handleAuthLogin(event)">
                <div class="form-field"><label>Username</label><input type="text" id="authUsername" placeholder="Username" required></div>
                <div class="form-field"><label>Password</label><input type="password" id="authPassword" placeholder="Password" required></div>
                <button type="submit" class="btn-primary btn-full" id="authBtn"><span>Sign In</span> <div class="btn-spinner" style="display:none"></div></button>
                <p class="form-switch" id="authError" style="color:var(--red);display:none"></p>
            </form>
            <p class="form-switch" style="margin-top:16px"><a href="index.html">← Back to site</a></p>
        </div>
    </div>
    <div class="toast" id="toast"><span id="toastText"></span></div>
    <script>
    var params = new URLSearchParams(window.location.search);
    var isFromLoader = params.get('from') === 'loader';
    var loaderPort = params.get('port') || '9080';
    if (isFromLoader) document.getElementById('loaderHint').style.display = 'flex';

    function handleAuthLogin(e) {
        e.preventDefault();
        var b = document.getElementById('authBtn');
        var s = b.querySelector('span');
        var sp = b.querySelector('.btn-spinner');
        var err = document.getElementById('authError');
        b.disabled = true; s.style.display = 'none'; sp.style.display = 'inline-block';
        err.style.display = 'none';

        var username = document.getElementById('authUsername').value;
        var password = document.getElementById('authPassword').value;

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.token) {
                if (isFromLoader) {
                    document.getElementById('authModal').innerHTML =
                        '<div class="success-box">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' +
                            '<h3>Authenticated!</h3>' +
                            '<p>You can close this window and return to the loader.</p>' +
                        '</div>';
                    setTimeout(function() {
                        window.location.href = 'http://127.0.0.1:' + loaderPort + '/auth?token=' + encodeURIComponent(data.token) + '&username=' + encodeURIComponent(data.username);
                    }, 1500);
                } else {
                    localStorage.setItem('airdlc_session', data.username);
                    window.location.href = 'dashboard.html';
                }
            } else {
                err.textContent = data.error || 'Invalid credentials';
                err.style.display = 'block';
                b.disabled = false; s.style.display = 'inline'; sp.style.display = 'none';
            }
        })
        .catch(function() {
            err.textContent = 'Connection error';
            err.style.display = 'block';
            b.disabled = false; s.style.display = 'inline'; sp.style.display = 'none';
        });
        return false;
    }
    (function(){var pc=document.getElementById('particles');if(pc){for(var i=0;i<24;i++){var d=document.createElement('div');d.className='particle'+(Math.random()>0.5?' glow':'');d.style.left=(Math.random()*100)+'%';d.style.animationDelay=(Math.random()*20)+'s';d.style.animationDuration=(14+Math.random()*14)+'s';var sz=(2+Math.random()*3)+'px';d.style.width=sz;d.style.height=sz;pc.appendChild(d);}}var glow=document.getElementById('cursorGlow');if(glow){var mx=0,my=0,gx=0,gy=0;document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY},{passive:true});(function a(){gx+=(mx-gx)*0.1;gy+=(my-gy)*0.1;glow.style.left=gx+'px';glow.style.top=gy+'px';requestAnimationFrame(a)})()}})();
    </script>
</body>
</html>
