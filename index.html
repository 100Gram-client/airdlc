<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт обновляется</title>
    <!-- Подключаем иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #000;
            --bg2: #0a0a0a;
            --bg3: #111;
            --surface2: rgba(255, 255, 255, .06);
            --border: rgba(255, 255, 255, .08);
            --border2: rgba(255, 255, 255, .12);
            --text: #fff;
            --text2: rgba(255, 255, 255, .7);
            --text3: rgba(255, 255, 255, .4);
            --green: #22c55e;
            --red: #ef4444;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --transition: all .2s ease;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Главная карточка */
        .preview-window {
            width: 100%;
            max-width: 550px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .preview-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
        }

        .preview-dots { display: flex; gap: 6px; }
        .preview-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--surface2); }
        .preview-dots span:nth-child(1) { background: #ef4444; }
        .preview-dots span:nth-child(2) { background: #eab308; }
        .preview-dots span:nth-child(3) { background: #22c55e; }

        .preview-title { font-size: .75rem; color: var(--text3); }

        .preview-body { padding: 48px 32px; text-align: center; }

        /* Бейдж статуса */
        .preview-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 100px;
            background: var(--surface2);
            font-size: .8rem;
            color: var(--text2);
            margin-bottom: 24px;
            border: 1px solid var(--border2);
        }

        .preview-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px rgba(34, 197, 94, .5);
        }

        /* Иконка / Анимация */
        .preview-logo {
            font-size: 3rem;
            margin: 0 auto 24px;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-logo i.fa-gear {
            animation: spin 6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Тексты */
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -.03em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, rgba(255, 255, 255, .5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: .95rem;
            color: var(--text2);
            line-height: 1.6;
            margin-bottom: 32px;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Прогресс-бар */
        .progress-box {
            margin-bottom: 32px;
            text-align: left;
        }

        .preview-bar {
            height: 4px;
            background: var(--surface2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .preview-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--green), rgba(34, 197, 94, .3));
            border-radius: 2px;
            animation: barPulse 2s ease-in-out infinite;
        }

        @keyframes barPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }

        .preview-bar-text {
            display: flex;
            justify-content: space-between;
            font-size: .7rem;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        /* Таймер */
        .timer {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .timer-item {
            padding: 12px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            min-width: 70px;
        }

        .timer-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
        }

        .timer-label {
            font-size: .65rem;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-top: 2px;
        }

        /* Форма подписки */
        .dash-form {
            display: flex;
            gap: 8px;
            max-width: 420px;
            margin: 0 auto;
        }

        .dash-form input {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: .875rem;
            outline: none;
            transition: var(--transition);
        }

        .dash-form input::placeholder { color: var(--text3); }
        .dash-form input:focus { border-color: rgba(255, 255, 255, .25); }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            background: var(--text);
            color: var(--bg);
            font-size: .875rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-primary:hover {
            opacity: .85;
            transform: translateY(-1px);
        }

        @media(max-width: 500px) {
            .preview-body { padding: 32px 20px; }
            .dash-form { flex-direction: column; }
            .btn-primary { width: 100%; justify-content: center; }
            .timer { gap: 8px; }
            .timer-item { min-width: 55px; padding: 8px; }
            .timer-number { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="preview-window">
        <div class="preview-header">
            <div class="preview-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="preview-title">system / maintenance_mode</div>
        </div>

        <div class="preview-body">
            <div class="preview-status">
                <span class="preview-status-dot"></span>
                Техническое обслуживание
            </div>

            <div class="preview-logo">
                <i class="fa-solid fa-gear"></i>
            </div>

            <h1>Сайт обновляется</h1>
            <p>Прямо сейчас мы внедряем новые функции и проводим оптимизацию системы. Скоро вернемся в строй!</p>

            <!-- Шкала прогресса -->
            <div class="progress-box">
                <div class="preview-bar">
                    <div class="preview-bar-fill"></div>
                </div>
                <div class="preview-bar-text">
                    <span>Статус обновления</span>
                    <span>В процессе</span>
                </div>
            </div>

            <!-- Обратный отсчет -->
            <div class="timer">
                <div class="timer-item">
                    <div class="timer-number" id="hours">02</div>
                    <div class="timer-label">Часов</div>
                </div>
                <div class="timer-item">
                    <div class="timer-number" id="minutes">45</div>
                    <div class="timer-label">Минут</div>
                </div>
                <div class="timer-item">
                    <div class="timer-number" id="seconds">00</div>
                    <div class="timer-label">Секунд</div>
                </div>
            </div>

            <!-- Форма уведомления -->
            <form class="dash-form" onsubmit="event.preventDefault(); alert('Спасибо! Мы уведомим вас после запуска.');">
                <input type="email" placeholder="Введите ваш e-mail" required>
                <button type="submit" class="btn-primary">Уведомить</button>
            </form>
        </div>
    </div>

    <script>
        let totalSeconds = 2 * 3600 + 45 * 60; 

        function updateTimer() {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;

            if (totalSeconds > 0) {
                totalSeconds--;
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
