<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Привязка устройства — Cloud Config | Air DLC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cloudconfig.css">
</head>
<body>
  <div class="cc-aurora"><div class="cc-grid-bg"></div><div class="cc-orb-3"></div></div>

  <div class="cc-auth-container">
    <div class="cc-auth-card" style="max-width:480px">
      <div style="text-align:center;margin-bottom:24px">
        <div style="font-size:2.5rem;margin-bottom:12px">🎮</div>
        <h2>Привязка устройства</h2>
        <p class="cc-auth-subtitle">Введи код из чата игры для авторизации</p>
      </div>

      <div id="deviceStatus" style="text-align:center;padding:16px;background:rgba(255,255,255,0.03);border:1px solid var(--cc-border-mid);border-radius:12px;margin-bottom:20px;display:none">
        <div class="cc-status-dot" style="margin:0 auto 8px"></div>
        <div style="font-size:0.82rem;color:var(--cc-text-secondary)">Ожидание ввода кода...</div>
      </div>

      <div id="deviceError" style="display:none;padding:12px 16px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:8px;font-size:0.82rem;color:#ef4444;margin-bottom:16px"></div>
      <div id="deviceSuccess" style="display:none;padding:12px 16px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:8px;font-size:0.82rem;color:#22c55e;margin-bottom:16px"></div>

      <div class="cc-device-code" id="deviceCodeInputs">
        <input class="cc-device-input" type="text" maxlength="1" data-index="0" />
        <input class="cc-device-input" type="text" maxlength="1" data-index="1" />
        <input class="cc-device-input" type="text" maxlength="1" data-index="2" />
        <input class="cc-device-input" type="text" maxlength="1" data-index="3" />
        <input class="cc-device-input" type="text" maxlength="1" data-index="4" />
        <input class="cc-device-input" type="text" maxlength="1" data-index="5" />
      </div>

      <p style="text-align:center;font-size:0.78rem;color:var(--cc-text-tertiary);margin-top:8px">
        Код можно получить в игре командой <code style="font-family:var(--cc-font-mono);color:var(--cc-accent-purple)">.cloudconfig auth</code>
      </p>
    </div>
  </div>

  <script src="cloud.js"></script>
  <script>
    const inputs = document.querySelectorAll('.cc-device-input');
    let submitted = false;

    inputs.forEach((input, i) => {
      input.addEventListener('focus', () => {
        input.select();
      });

      input.addEventListener('input', (e) => {
        const val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        e.target.value = val;
        e.target.classList.toggle('filled', !!val);

        if (val && i < inputs.length - 1) {
          inputs[i + 1].focus();
        }

        if (i === inputs.length - 1 && val) {
          const code = Array.from(inputs).map(inp => inp.value).join('');
          if (code.length === 6) {
            submitCode(code);
          }
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) {
          inputs[i - 1].focus();
          inputs[i - 1].value = '';
          inputs[i - 1].classList.remove('filled');
        }
        if (e.key === 'ArrowLeft' && i > 0) inputs[i - 1].focus();
        if (e.key === 'ArrowRight' && i < inputs.length - 1) inputs[i + 1].focus();
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData.getData('text') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
        if (text) {
          text.split('').forEach((ch, idx) => {
            if (inputs[idx]) {
              inputs[idx].value = ch;
              inputs[idx].classList.add('filled');
            }
          });
          const nextIdx = Math.min(text.length, inputs.length - 1);
          inputs[nextIdx].focus();
          if (text.length === 6) {
            submitCode(text);
          }
        }
      });
    });

    inputs[0].focus();

    async function submitCode(code) {
      if (submitted) return;
      submitted = true;

      document.getElementById('deviceError').style.display = 'none';
      document.getElementById('deviceStatus').style.display = 'block';

      try {
        const res = await fetch('/api/auth/device/approve', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (CloudAuth.getToken() || ''),
          },
          body: JSON.stringify({ code }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Ошибка');
        }

        document.getElementById('deviceStatus').style.display = 'none';
        const successBox = document.getElementById('deviceSuccess');
        successBox.style.display = 'block';
        successBox.textContent = `Устройство привязано к ${data.username}! Теперь вернись в игру.`;

        CloudToast.success('Устройство успешно привязано!');
      } catch (err) {
        document.getElementById('deviceStatus').style.display = 'none';
        const errBox = document.getElementById('deviceError');
        errBox.style.display = 'block';
        errBox.textContent = err.message;
        submitted = false;
      }
    }
  </script>
</body>
</html>
